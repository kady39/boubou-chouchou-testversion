<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>I love you — Chouchou</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
<style>
  html, body { height:100%; }
  body.yes-page {
    margin:0;
    min-height:100vh;
    background:radial-gradient(circle at 50% 20%, #12335c 0%, #0a1f3d 45%, #07152e 100%);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow-x:hidden;
    position:relative;
    font-family:"Montserrat", sans-serif;
  }
  .yes-stars {
    position:fixed; inset:0; pointer-events:none;
    background-image:
      radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,.7), transparent),
      radial-gradient(1px 1px at 80% 10%, rgba(255,255,255,.5), transparent),
      radial-gradient(2px 2px at 30% 70%, rgba(255,255,255,.6), transparent),
      radial-gradient(1px 1px at 60% 85%, rgba(255,255,255,.5), transparent),
      radial-gradient(1px 1px at 90% 60%, rgba(255,255,255,.4), transparent),
      radial-gradient(1px 1px at 45% 35%, rgba(255,255,255,.5), transparent);
    opacity:.8;
  }
  .yes-moon { position:fixed; top:60px; right:60px; font-size:2.4rem; opacity:.5; z-index:1; }

  .yes-wrap {
    position:relative;
    z-index:2;
    max-width:620px;
    margin:0 auto;
    padding:40px 24px;
    text-align:center;
  }
  .yes-wrap .eyebrow {
    opacity:.75; letter-spacing:.08em; text-transform:uppercase; font-size:.8rem; margin-bottom:14px;
  }
  .yes-wrap h1 {
    font-family:"Cormorant Garamond", serif;
    font-size:clamp(2.1rem, 6vw, 3.2rem);
    line-height:1.3;
    margin:0 0 16px;
  }
  .yes-wrap h1 em { font-style:italic; opacity:.9; }
  .yes-sub {
    opacity:.85; margin-bottom:44px; font-size:1.05rem; line-height:1.6;
  }

  .countdown-label {
    opacity:.7; letter-spacing:.06em; text-transform:uppercase; font-size:.8rem; margin-bottom:18px;
  }
  .countdown {
    display:flex; gap:16px; justify-content:center; flex-wrap:wrap; margin-bottom:38px;
  }
  .countdown .unit {
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.18);
    border-radius:16px;
    padding:18px 20px;
    min-width:84px;
    backdrop-filter:blur(4px);
  }
  .countdown .unit .num {
    font-family:"Cormorant Garamond", serif;
    font-size:2.2rem;
    font-weight:600;
    line-height:1;
    display:block;
  }
  .countdown .unit .lbl {
    font-size:.7rem;
    opacity:.7;
    text-transform:uppercase;
    letter-spacing:.06em;
    display:block;
    margin-top:6px;
  }

  .waiting-note {
    font-family:"Cormorant Garamond", serif;
    font-style:italic;
    font-size:1.15rem;
    opacity:.9;
  }

  .arrived-msg {
    display:none;
    font-family:"Cormorant Garamond", serif;
    font-size:clamp(1.8rem, 5vw, 2.4rem);
  }
</style>
</head>
<body class="yes-page">
  <div class="yes-stars"></div>
  <div class="yes-moon">☾</div>

  <div class="yes-wrap">
    <p class="eyebrow">You said yes ♡</p>
    <h1>I love you so much.<br><em>I'll be right here, waiting.</em></h1>
    <p class="yes-sub">Every day between now and then, just know you're the one I'm thinking of.</p>

    <p class="countdown-label" id="countdownLabel">Counting down to October 23</p>
    <div class="countdown" id="countdown">
      <div class="unit"><span class="num" id="cd-days">--</span><span class="lbl">days</span></div>
      <div class="unit"><span class="num" id="cd-hours">--</span><span class="lbl">hours</span></div>
      <div class="unit"><span class="num" id="cd-mins">--</span><span class="lbl">mins</span></div>
      <div class="unit"><span class="num" id="cd-secs">--</span><span class="lbl">secs</span></div>
    </div>

    <p class="waiting-note" id="waitingNote">Be waiting for me. I'll be waiting for you too. ♡</p>
    <p class="arrived-msg" id="arrivedMsg">It's here. Happy October 23, my love. ♡</p>
  </div>

  <script>
    (function () {
      // Target date — adjust the year below if you're counting toward a future year's Oct 23
      var target = new Date('2026-10-23T00:00:00');

      var elDays = document.getElementById('cd-days');
      var elHours = document.getElementById('cd-hours');
      var elMins = document.getElementById('cd-mins');
      var elSecs = document.getElementById('cd-secs');
      var countdownBox = document.getElementById('countdown');
      var label = document.getElementById('countdownLabel');
      var waitingNote = document.getElementById('waitingNote');
      var arrivedMsg = document.getElementById('arrivedMsg');

      function pad(n) { return String(n).padStart(2, '0'); }

      function tick() {
        var now = new Date();
        var diff = target - now;

        if (diff <= 0) {
          countdownBox.style.display = 'none';
          label.style.display = 'none';
          waitingNote.style.display = 'none';
          arrivedMsg.style.display = 'block';
          clearInterval(timer);
          return;
        }

        var days = Math.floor(diff / (1000 * 60 * 60 * 24));
        var hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        var mins = Math.floor((diff / (1000 * 60)) % 60);
        var secs = Math.floor((diff / 1000) % 60);

        elDays.textContent = days;
        elHours.textContent = pad(hours);
        elMins.textContent = pad(mins);
        elSecs.textContent = pad(secs);
      }

      tick();
      var timer = setInterval(tick, 1000);
    })();
  </script>

  <script src="js/main.js"></script>
</body>
</html>
